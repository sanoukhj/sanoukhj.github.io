<!DOCTYPE html>
<html lang="sv" class="h-full bg-neutral-950 text-neutral-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anetts champagnelista 2026-2027</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            100: '#fef9c3',
                            300: '#fde047',
                            400: '#facc15',
                            500: '#eab308',
                            600: '#ca8a04',
                            700: '#a16207',
                        },
                        rose: {
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                        }
                    },
                    fontFamily: {
                        serif: ['Cinzel', 'Georgia', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            touch-action: pan-y;
            overflow-x: hidden;
            background: radial-gradient(circle at top center, #1c1813 0%, #0a0a0a 100%);
        }
        .glass-card {
            background: linear-gradient(145deg, rgba(30, 27, 22, 0.7) 0%, rgba(15, 15, 15, 0.9) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.8), 0 0 25px -5px rgba(234, 179, 8, 0.05);
        }
        .gold-gradient-text {
            background: linear-gradient(135deg, #FFFFFF 0%, #FDE047 50%, #CA8A04 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card-transition {
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans text-neutral-200 antialiased selection:bg-gold-500 selection:text-black justify-between">

    <!-- Header Section -->
    <header class="w-full py-5 px-4 text-center border-b border-gold-500/10 bg-neutral-950/60 backdrop-blur-md">
        <div class="inline-flex items-center space-x-2">
            <i class="fa-solid font-serif text-xl text-gold-400">🍾</i>
            <h1 class="font-serif font-bold text-xl sm:text-2xl tracking-widest gold-gradient-text uppercase">Anetts champagnelista</h1>
        </div>
        <p class="text-[10px] text-neutral-400 tracking-widest uppercase mt-0.5">2026 - 2027</p>
    </header>

    <!-- Main Content Container for Single Mobile Card View -->
    <main class="flex-grow flex flex-col items-center justify-center p-4 max-w-md mx-auto w-full relative">
        
        <!-- Card Stage Wrapper -->
        <div id="cardStage" class="w-full relative min-h-[520px] sm:min-h-[560px] flex items-center justify-center">
            <!-- Dynamic Single Card Content rendered via JavaScript -->
        </div>

        <!-- Navigation & Counter Controls -->
        <div class="w-full flex items-center justify-between mt-5 px-2">
            <button id="prevBtn" onclick="prevCard()" class="w-12 h-12 rounded-full glass-card flex items-center justify-center text-gold-400 hover:bg-gold-500 hover:text-neutral-950 transition-all active:scale-90 border border-gold-500/30">
                <i class="fa-solid fa-chevron-left text-base"></i>
            </button>

            <div class="flex flex-col items-center">
                <span id="cardCounter" class="font-serif text-sm font-semibold tracking-widest text-gold-400">1 / 12</span>
                <span class="text-[9px] uppercase tracking-wider text-neutral-500 mt-0.5">Svep för att bläddra</span>
            </div>

            <button id="nextBtn" onclick="nextCard()" class="w-12 h-12 rounded-full glass-card flex items-center justify-center text-gold-400 hover:bg-gold-500 hover:text-neutral-950 transition-all active:scale-90 border border-gold-500/30">
                <i class="fa-solid fa-chevron-right text-base"></i>
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center border-t border-neutral-900 bg-neutral-950/80 text-[11px] text-neutral-500">
        <p>Systembolagets artikelnummer anges som varunummer.</p>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        const champagnes = [
            {
                id: 1,
                fullTitle: "Albert Lebrun Blanc de Noirs Extra Brut",
                producer: "Champagne Albert Lebrun",
                varunr: "72257",
                iconType: "black",
                typeText: "Blanc de Noirs",
                vintage: null,
                description: "Huset Albert Lebrun grundades 1860 och ingår i dag i den anrika familjeägda GH Martel-gruppen. Som en Blanc de Noirs är champagnen framställd enbart på blå druvor (Pinot Noir och Meunier). Den låga sockerhalten (Extra Brut) ger en stram, frisk och fyllig profil med inslag av röda äpplen, mineralitet och rostat bröd.",
                link: "https://www.champagne-albert-lebrun.com"
            },
            {
                id: 2,
                fullTitle: "Heidsieck & Co Edition Jönköping Brut",
                producer: "Heidsieck & Co Monopole",
                varunr: "55242",
                iconType: "gold",
                typeText: "Brut",
                vintage: null,
                description: "Heidsieck & Co Monopole grundades 1785 och är ett av Champagnes äldsta hus. Namnet ”Edition Jönköping” hyllar det svenska fartyget Jönköping som sänktes 1916 med husets champagne ombord, vilken bärgades 1998 i fantastiskt drickbart skick. Champagnen har en tillgänglig och fruktig stil med toner av gula äpplen, citrus, honung och kex.",
                link: "https://www.heidsieck-monopole.com"
            },
            {
                id: 3,
                fullTitle: "Cuvée Prestige Rosé Millésime 2022",
                producer: "JM Gobillard & Fils",
                varunr: "2735",
                iconType: "rose",
                typeText: "Rosé Millésimé",
                vintage: "2022",
                description: "JM Gobillard & Fils är en familjeägd producent baserad i Hautvillers – den historiska byn där munken Dom Pérignon verksammades. Denna årgångsrosé tillverkas på noggrant utvalda druvor från bra lägen för att ge extra djup och karaktär. Smaken är elegant och frisk med inslag av smultron, hallon, rostat bröd och en krispig syra.",
                link: "https://www.champagne-gobillard.com"
            },
            {
                id: 4,
                fullTitle: "Louis Roederer Collection 247",
                producer: "Louis Roederer",
                varunr: "7602",
                iconType: "gold",
                typeText: "Brut",
                vintage: null,
                description: "Louis Roederer grundades 1776 i Reims och hör till Champagnes mest hyllade oberoende hus. Collection 247 markerar husets 247:e skörd och bygger på en solera-liknande reservvinsmetod som ger stor komplexitet och konsistens. Champagnen bjuder på en nyanserad profil med toner av mogen citrus, rostat bröd, kritig mineralitet och en lång, krämig finish.",
                link: "https://www.louis-roederer.com"
            },
            {
                id: 5,
                fullTitle: "Henriot Millésimé Brut 2015",
                producer: "Champagne Henriot",
                varunr: "77710",
                iconType: "gold",
                typeText: "Millésimé",
                vintage: "2015",
                description: "Huset Henriot grundades 1808 i Reims av Apolline Henriot och är känt för sin höga andel Premier- och Grand Cru-druvor. Denna årgångschampagne speglar ett enskilt års unika skörd och har lagrats länge i husets källare. Resultatet är en fyllig och utvecklad champagne med toner av brioche, torkad frukt, hasselnötter och frisk citrus.",
                link: "https://www.champagne-henriot.com"
            },
            {
                id: 6,
                fullTitle: "Alexandre Bonnet Perle Rosée Brut",
                producer: "Alexandre Bonnet",
                varunr: "7471",
                iconType: "rose",
                typeText: "Rosé Brut",
                vintage: null,
                description: "Alexandre Bonnet ligger i Les Riceys i Aube-regionen, ett område berömt för sina exceptionella Pinot Noir-vingårdar. Denna cuvée är en hantverksmässig rosé gjord enbart på Pinot Noir som lyfter fram druvans rödfruktiga karaktär. Vinet har en frisk och stram profil med smaker av skogshallon, röda vinbär, blodapelsin och krispig mineralitet.",
                link: "https://www.alexandrebonnet.com"
            },
            {
                id: 7,
                fullTitle: "Beaumont des Crayères Fleur de Prestige",
                producer: "Beaumont des Crayères",
                varunr: "74373",
                iconType: "gold",
                typeText: "Prestige Brut",
                vintage: null,
                description: "Beaumont des Crayères är ett högklassigt kooperativ i Mardeuil grundat 1955 med särskilt fokus på druvan Pinot Meunier. Fleur de Prestige är deras toppcuvée som endast framställs under enastående årgångar. Vinet är rikt och krämigt med nyanser av mörka äpplen, brynt smör, rostad mandel och en lång, elegant avslutning.",
                link: "https://www.champagne-beaumont.com"
            },
            {
                id: 8,
                fullTitle: "Gaston Révolte Brut Tradition 1er Cru",
                producer: "Gaston Révolte",
                varunr: "71776",
                iconType: "gold",
                typeText: "1er Cru Brut",
                vintage: null,
                description: "Gaston Révolte är en oberoende odlare (Récoltant-Manipulant) baserad i Premier Cru-byn Avenay Val d'Or. Vinet framställs hantverksmässigt av druvor från egna Premier Cru-vingårdar med tyngdpunkt på Pinot Noir. Det ger en genuin champagne med fylliga toner av röda äpplen, kex, nougat och en välbalanserad friskhet.",
                link: "https://www.champagne-gaston-revolte.fr"
            },
            {
                id: 9,
                fullTitle: "Champagne Charles le Bel B-S Inspiration 1818",
                producer: "Billecart-Salmon (Charles le Bel)",
                varunr: "75114",
                iconType: "gold",
                typeText: "Brut",
                vintage: null,
                description: "Charles le Bel är ett andramärke skapat av det anrika huset Billecart-Salmon, vilket ger mycket hög vinmakarstandard till ett tillgängligt pris. Champagnen produceras under samma noggranna kvalitetstänk om elegans och renhet som moderhuset. Profilen är harmonisk med fräscha toner av vit frukt, citrus, brioche och fin bubblighet.",
                link: "https://www.champagne-billecart.com"
            },
            {
                id: 10,
                fullTitle: "G.H. Martel Brut Blanc de Noirs",
                producer: "G.H. Martel & Co",
                varunr: "73036",
                iconType: "black",
                typeText: "Blanc de Noirs",
                vintage: null,
                description: "G.H. Martel grundades 1869 i Épernay och drivs i dag av familjen Rapeneau som ett av de största oberoende champagnehusen. Denna Blanc de Noirs tillverkas enbart på blå druvor (Pinot Noir och Meunier), vilket ger struktur och tyngd. Smaken bjuder på inslag av gula och röda äpplen, plommon, rostat bröd och en matvänlig finish.",
                link: "https://www.champagne-ghmartel.com"
            },
            {
                id: 11,
                fullTitle: "Billecart-Salmon Brut Réserve",
                producer: "Billecart-Salmon",
                varunr: "7454",
                iconType: "gold",
                typeText: "Brut Réserve",
                vintage: null,
                description: "Billecart-Salmon grundades 1818 i Mareuil-sur-Aÿ och är världsberömt för sin eleganta stil och långsamma jäsningsprocess vid låg temperatur. Brut Réserve är husets ikoniska flaggskepp med en perfekt balanserad blend av Pinot Noir, Meunier och Chardonnay. Vinet är extremt raffinerat med toner av gröna äpplen, färsk brioche, vita blommor och en silkeslen textur.",
                link: "https://www.champagne-billecart.com"
            },
            {
                id: 12,
                fullTitle: "Mandois Blanc de Noirs Brut",
                producer: "Champagne Mandois",
                varunr: "50615",
                iconType: "black",
                typeText: "Blanc de Noirs",
                vintage: null,
                description: "Mandois har en historia från 1735 i Pierry och är känt för sitt starka engagemang i ekologisk och hållbar vingårdsdrift. Denna Blanc de Noirs kombinerar Pinot Noir och Pinot Meunier för att skapa en fyllig och karaktärsfull stil. Vinet har ett fint djup med smaker av mörka bär, rostat bröd och en stram, frisk syra som passar utmärkt till mat.",
                link: "https://www.champagne-mandois.fr"
            }
        ];

        let currentIndex = 0;
        let touchStartX = 0;
        let touchEndX = 0;

        // Render Icon Container HTML
        function getIconContainerHTML(item) {
            let containerBg = "";
            let borderColor = "";
            let iconColor = "";
            let tagClass = "";

            if (item.iconType === 'rose') {
                containerBg = "bg-rose-950/30";
                borderColor = "border-rose-500/40 shadow-[0_0_20px_rgba(244,63,94,0.15)]";
                iconColor = "text-rose-400";
                tagClass = "bg-rose-500/20 text-rose-300 border-rose-500/30";
            } else if (item.iconType === 'black') {
                containerBg = "bg-neutral-900/90";
                borderColor = "border-neutral-700/80 ring-1 ring-gold-500/30 shadow-[0_0_20px_rgba(0,0,0,0.6)]";
                iconColor = "text-gold-400";
                tagClass = "bg-neutral-800 text-neutral-300 border-neutral-700";
            } else { // Regular Gold
                containerBg = "bg-amber-950/20";
                borderColor = "border-gold-500/40 shadow-[0_0_20px_rgba(234,179,8,0.15)]";
                iconColor = "text-gold-400";
                tagClass = "bg-gold-500/10 text-gold-400 border-gold-500/30";
            }

            // Star Badge for Vintage Wines
            let vintageBadge = "";
            if (item.vintage) {
                vintageBadge = `
                    <div class="absolute -top-2.5 -right-2.5 z-20 bg-neutral-950 border border-gold-400 p-1.5 rounded-full shadow-xl flex items-center justify-center min-w-[44px] min-h-[44px]">
                        <div class="relative flex items-center justify-center">
                            <i class="fa-solid fa-star text-gold-400 text-2xl"></i>
                            <span class="absolute inset-0 flex items-center justify-center font-bold text-[10px] text-neutral-950 font-sans tracking-tight">
                                ${item.vintage}
                            </span>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="relative w-full h-44 rounded-2xl ${containerBg} border ${borderColor} flex flex-col items-center justify-center p-4 my-3">
                    ${vintageBadge}
                    
                    <div class="w-16 h-16 rounded-full bg-neutral-950 border border-neutral-800 flex items-center justify-center mb-2 shadow-inner">
                        <i class="fa-solid fa-wine-glass-empty text-3xl ${iconColor}"></i>
                    </div>

                    <span class="px-3 py-0.5 rounded-full text-[10px] font-semibold border uppercase tracking-wider ${tagClass}">
                        ${item.typeText}
                    </span>
                </div>
            `;
        }

        // Render Active Card
        function renderCard() {
            const stage = document.getElementById('cardStage');
            const item = champagnes[currentIndex];

            stage.innerHTML = `
                <div id="activeCard" class="glass-card rounded-3xl p-6 sm:p-7 flex flex-col justify-between w-full h-full card-transition opacity-100 scale-100">
                    <div>
                        <!-- Header with Varunr & Vintage tag -->
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-[11px] font-mono tracking-widest text-neutral-400 uppercase bg-neutral-900/90 px-3 py-1 rounded-lg border border-neutral-800">
                                Varunr: <strong class="text-gold-400 font-semibold">${item.varunr}</strong>
                            </span>
                            ${item.vintage ? `<span class="text-xs font-serif text-gold-300 font-bold tracking-wider">Årgång ${item.vintage}</span>` : ''}
                        </div>

                        <!-- Bottle Icon Representation -->
                        ${getIconContainerHTML(item)}

                        <!-- Producer & Name -->
                        <div class="mt-4">
                            <p class="text-[11px] font-medium text-neutral-400 uppercase tracking-widest">${item.producer}</p>
                            <h2 class="font-serif text-xl sm:text-2xl font-bold text-neutral-100 mt-1 leading-tight gold-gradient-text">
                                ${item.fullTitle}
                            </h2>
                        </div>

                        <!-- Description -->
                        <p class="text-xs text-neutral-300 mt-3 leading-relaxed font-normal">
                            ${item.description}
                        </p>
                    </div>

                    <!-- Direct Link Button -->
                    <div class="mt-6 pt-4 border-t border-neutral-800/80">
                        <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="w-full py-3 px-4 rounded-xl bg-neutral-900 hover:bg-gold-500 text-neutral-200 hover:text-neutral-950 font-semibold text-xs tracking-wider transition-all duration-200 border border-neutral-800 hover:border-gold-500 flex items-center justify-center gap-2 group shadow-lg">
                            <span>Besök Producent</span>
                            <i class="fa-solid fa-arrow-up-right-from-square text-[10px] opacity-70 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform"></i>
                        </a>
                    </div>
                </div>
            `;

            // Update Counter Text
            document.getElementById('cardCounter').innerText = `${currentIndex + 1} / ${champagnes.length}`;

            // Add Swipe Touch Event Listeners to Card
            const cardEl = document.getElementById('activeCard');
            cardEl.addEventListener('touchstart', handleTouchStart, { passive: true });
            cardEl.addEventListener('touchend', handleTouchEnd, { passive: true });
        }

        function nextCard() {
            if (currentIndex < champagnes.length - 1) {
                animateTransition('left', () => {
                    currentIndex++;
                    renderCard();
                });
            } else {
                animateTransition('left', () => {
                    currentIndex = 0;
                    renderCard();
                });
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                animateTransition('right', () => {
                    currentIndex--;
                    renderCard();
                });
            } else {
                animateTransition('right', () => {
                    currentIndex = champagnes.length - 1;
                    renderCard();
                });
            }
        }

        function animateTransition(direction, callback) {
            const card = document.getElementById('activeCard');
            if (!card) return callback();

            const xOffset = direction === 'left' ? '-40px' : '40px';
            card.style.transform = `translateX(${xOffset}) scale(0.95)`;
            card.style.opacity = '0';

            setTimeout(() => {
                callback();
            }, 180);
        }

        // Swipe Touch Handlers
        function handleTouchStart(e) {
            touchStartX = e.changedTouches[0].screenX;
        }

        function handleTouchEnd(e) {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }

        function handleSwipe() {
            const swipeThreshold = 40;
            if (touchStartX - touchEndX > swipeThreshold) {
                nextCard(); // Swiped left -> next
            } else if (touchEndX - touchStartX > swipeThreshold) {
                prevCard(); // Swiped right -> prev
            }
        }

        // Keyboard navigation support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextCard();
            if (e.key === 'ArrowLeft') prevCard();
        });

        // Initialize App
        window.onload = function() {
            renderCard();
        };
    </script>
</body>
</html>
