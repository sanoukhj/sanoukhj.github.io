<!DOCTYPE html>
<html lang="sv" class="h-full bg-neutral-900 text-stone-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anetts champagnelista 2026-2027</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Pinyon+Script&family=Alex+Brush&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        parchment: '#f7f4ed',
                        paperDark: '#ebe4d5',
                        goldLeaf: '#c5a059',
                        goldBorder: '#d4af37',
                        ink: '#2c2523',
                        roseDust: '#c87d88',
                        noirDark: '#1a1818'
                    },
                    fontFamily: {
                        script: ['"Pinyon Script"', 'cursive'],
                        accentScript: ['"Alex Brush"', 'cursive'],
                        serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #121110;
            background-image: radial-gradient(#24201d 1px, transparent 0);
            background-size: 24px 24px;
            font-family: 'Cormorant Garamond', serif;
        }

        .paper-card {
            background-color: #f7f4ed;
            background-image: 
                radial-gradient(rgba(0, 0, 0, 0.02) 1px, transparent 0),
                linear-gradient(to bottom, #fcfaf5 0%, #f3ede2 100%);
            background-size: 16px 16px, 100% 100%;
            box-shadow: 
                0 15px 35px -5px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(197, 160, 89, 0.3),
                inset 0 0 80px rgba(197, 160, 89, 0.08);
            position: relative;
        }

        /* Gold Ornate Corner Frames */
        .corner-ornament {
            position: absolute;
            width: 28px;
            height: 28px;
            border-color: #c5a059;
            pointer-events: none;
            opacity: 0.8;
        }
        .corner-tl { top: 12px; left: 12px; border-top: 2px solid; border-left: 2px solid; }
        .corner-tr { top: 12px; right: 12px; border-top: 2px solid; border-right: 2px solid; }
        .corner-bl { bottom: 12px; left: 12px; border-bottom: 2px solid; border-left: 2px solid; }
        .corner-br { bottom: 12px; right: 12px; border-bottom: 2px solid; border-right: 2px solid; }

        /* Gold inner line frame */
        .inner-frame {
            border: 1px solid rgba(197, 160, 89, 0.4);
            margin: 6px;
            height: calc(100% - 12px);
            pointer-events: none;
        }

        .gold-shimmer {
            background: linear-gradient(135deg, #8a6d3b 0%, #c5a059 50%, #735728 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .handwritten {
            font-family: 'Pinyon Script', cursive;
            line-height: 1.1;
        }

        .page-transition {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between text-ink selection:bg-goldLeaf selection:text-white">

    <!-- Header -->
    <header class="w-full py-6 px-4 text-center border-b border-goldLeaf/20 bg-neutral-950/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="text-left">
                <span class="block handwritten text-2xl text-goldLeaf leading-none">Anetts champagnelista</span>
                <h1 class="font-serif font-semibold text-lg text-stone-200 uppercase tracking-widest -mt-1">2026 - 2027</h1>
            </div>

            <!-- View Mode Switcher -->
            <div class="flex items-center space-x-1 bg-stone-900/90 p-1 rounded-full border border-goldLeaf/30">
                <button id="btnSingle" onclick="setViewMode('single')" class="px-3 py-1 rounded-full text-xs font-serif transition-all bg-goldLeaf text-stone-950 font-bold shadow">
                    Kort
                </button>
                <button id="btnList" onclick="setViewMode('list')" class="px-3 py-1 rounded-full text-xs font-serif transition-all text-stone-400 hover:text-stone-200">
                    Hel Meny
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Stage -->
    <main class="flex-grow flex flex-col items-center justify-center p-3 sm:p-6 max-w-lg mx-auto w-full relative">
        
        <!-- SINGLE CARD VIEW -->
        <div id="singleView" class="w-full relative min-h-[580px] flex flex-col justify-between items-center">
            
            <div id="cardStage" class="w-full relative min-h-[520px] flex items-center justify-center">
                <!-- Dynamically populated via JS -->
            </div>

            <!-- Mobile Slider Controls -->
            <div class="w-full flex items-center justify-between mt-4 px-2">
                <button id="prevBtn" onclick="prevCard()" class="w-11 h-11 rounded-full bg-stone-900 border border-goldLeaf/40 flex items-center justify-center text-goldLeaf hover:bg-goldLeaf hover:text-stone-950 transition-all active:scale-90 shadow-lg">
                    <i class="fa-solid fa-chevron-left text-sm"></i>
                </button>

                <div class="text-center">
                    <span id="cardCounter" class="font-serif text-base font-semibold tracking-widest text-goldLeaf block">1 / 12</span>
                    <span class="handwritten text-lg text-stone-400 block -mt-1">Svep för nästa</span>
                </div>

                <button id="nextBtn" onclick="nextCard()" class="w-11 h-11 rounded-full bg-stone-900 border border-goldLeaf/40 flex items-center justify-center text-goldLeaf hover:bg-goldLeaf hover:text-stone-950 transition-all active:scale-90 shadow-lg">
                    <i class="fa-solid fa-chevron-right text-sm"></i>
                </button>
            </div>
        </div>

        <!-- FULL RESTAURANT MENU LIST VIEW -->
        <div id="listView" class="w-full hidden space-y-6">
            <div class="paper-card rounded-xl p-6 sm:p-8 relative">
                <div class="corner-ornament corner-tl"></div>
                <div class="corner-ornament corner-tr"></div>
                <div class="corner-ornament corner-bl"></div>
                <div class="corner-ornament corner-br"></div>
                
                <div class="text-center mb-8 border-b border-goldLeaf/30 pb-4">
                    <span class="handwritten text-4xl text-goldLeaf block">L'Aboitement</span>
                    <h2 class="font-serif text-2xl uppercase tracking-widest font-bold text-ink mt-1">Notre Sélection</h2>
                    <p class="text-xs italic text-stone-600 mt-1">Handplockade champagner från framstående hus</p>
                </div>

                <div id="listContainer" class="space-y-8">
                    <!-- Dynamically rendered list view -->
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full py-4 px-4 text-center border-t border-goldLeaf/20 bg-neutral-950/80 backdrop-blur-md">
        <span class="text-[11px] font-serif text-stone-400 tracking-widest">
            &copy; 2026 Anett's Champagne List | Crafted with care and passion
        </span>
    </footer>

    <script>
        const champagnes = [
            {
                id: 1,
                fullTitle: "Albert Lebrun Blanc de Noirs Extra Brut",
                producer: "Champagne Albert Lebrun",
                varunr: "72257",
                iconType: "black",
                typeText: "Blanc de Noirs",
                vintage: null,
                description: "Huset Albert Lebrun grundades 1860 och ingår i dag i den anrika familjeägda GH Martel-gruppen. Som en Blanc de Noirs är champagnen framställd enbart på blå druvor (Pinot Noir och Meunier). Den låga sockerhalten (Extra Brut) ger en stram, frisk och fyllig profil med inslag av röda äpplen, mineralitet och rostat bröd.",
                link: "https://www.champagne-albert-lebrun.com"
            },
            {
                id: 2,
                fullTitle: "Heidsieck & Co Edition Jönköping Brut",
                producer: "Heidsieck & Co Monopole",
                varunr: "55242",
                iconType: "gold",
                typeText: "Brut Tradition",
                vintage: null,
                description: "Heidsieck & Co Monopole grundades 1785 och är ett av Champagnes äldsta hus. Namnet ”Edition Jönköping” hyllar det svenska fartyget Jönköping som sänktes 1916 med husets champagne ombord, vilken bärgades 1998 i fantastiskt drickbart skick. Champagnen har en tillgänglig och fruktig stil med toner av gula äpplen, citrus, honung och kex.",
                link: "https://www.heidsieck-monopole.com"
            },
            {
                id: 3,
                fullTitle: "Cuvée Prestige Rosé Millésime 2022",
                producer: "JM Gobillard & Fils",
                varunr: "2735",
                iconType: "rose",
                typeText: "Rosé Millésimé",
                vintage: "2022",
                description: "JM Gobillard & Fils är en familjeägd producent baserad i Hautvillers – den historiska byn där munken Dom Pérignon verksammades. Denna årgångsrosé tillverkas på noggrant utvalda druvor från bra lägen för att ge extra djup och karaktär. Smaken är elegant och frisk med inslag av smultron, hallon, rostat bröd och en krispig syra.",
                link: "https://www.champagne-gobillard.com"
            },
            {
                id: 4,
                fullTitle: "Louis Roederer Collection 247",
                producer: "Louis Roederer",
                varunr: "7602",
                iconType: "gold",
                typeText: "Brut Collection",
                vintage: null,
                description: "Louis Roederer grundades 1776 i Reims och hör till Champagnes mest hyllade oberoende hus. Collection 247 markerar husets 247:e skörd och bygger på en solera-liknande reservvinsmetod som ger stor komplexitet och konsistens. Champagnen bjuder på en nyanserad profil med toner av mogen citrus, rostat bröd, kritig mineralitet och en lång, krämig finish.",
                link: "https://www.louis-roederer.com"
            },
            {
                id: 5,
                fullTitle: "Henriot Millésimé Brut 2015",
                producer: "Champagne Henriot",
                varunr: "77710",
                iconType: "gold",
                typeText: "Millésimé Brut",
                vintage: "2015",
                description: "Huset Henriot grundades 1808 i Reims av Apolline Henriot och är känt för sin höga andel Premier- och Grand Cru-druvor. Denna årgångschampagne speglar ett enskilt års unika skörd och har lagrats länge i husets källare. Resultatet är en fyllig och utvecklad champagne med toner av brioche, torkad frukt, hasselnötter och frisk citrus.",
                link: "https://www.champagne-henriot.com"
            },
            {
                id: 6,
                fullTitle: "Alexandre Bonnet Perle Rosée Brut",
                producer: "Alexandre Bonnet",
                varunr: "7471",
                iconType: "rose",
                typeText: "Rosé Brut",
                vintage: null,
                description: "Alexandre Bonnet ligger i Les Riceys i Aube-regionen, ett område berömt för sina exceptionella Pinot Noir-vingårdar. Denna cuvée är en hantverksmässig rosé gjord enbart på Pinot Noir som lyfter fram druvans rödfruktiga karaktär. Vinet har en frisk och stram profil med smaker av skogshallon, röda vinbär, blodapelsin och krispig mineralitet.",
                link: "https://www.alexandrebonnet.com"
            },
            {
                id: 7,
                fullTitle: "Beaumont des Crayères Fleur de Prestige",
                producer: "Beaumont des Crayères",
                varunr: "74373",
                iconType: "gold",
                typeText: "Prestige Brut",
                vintage: null,
                description: "Beaumont des Crayères är ett högklassigt kooperativ i Mardeuil grundat 1955 med särskilt fokus på druvan Pinot Meunier. Fleur de Prestige är deras toppcuvée som endast framställs under enastående årgångar. Vinet är rikt och krämigt med nyanser av mörka äpplen, brynt smör, rostad mandel och en lång, elegant avslutning.",
                link: "https://www.champagne-beaumont.com"
            },
            {
                id: 8,
                fullTitle: "Gaston Révolte Brut Tradition 1er Cru",
                producer: "Gaston Révolte",
                varunr: "71776",
                iconType: "gold",
                typeText: "1er Cru Brut",
                vintage: null,
                description: "Gaston Révolte är en oberoende odlare (Récoltant-Manipulant) baserad i Premier Cru-byn Avenay Val d'Or. Vinet framställs hantverksmässigt av druvor från egna Premier Cru-vingårdar med tyngdpunkt på Pinot Noir. Det ger en genuin champagne med fylliga toner av röda äpplen, kex, nougat och en välbalanserad friskhet.",
                link: "https://www.champagne-gaston-revolte.fr"
            },
            {
                id: 9,
                fullTitle: "Champagne Charles le Bel B-S Inspiration 1818",
                producer: "Billecart-Salmon (Charles le Bel)",
                varunr: "75114",
                iconType: "gold",
                typeText: "Brut",
                vintage: null,
                description: "Charles le Bel är ett andramärke skapat av det anrika huset Billecart-Salmon, vilket ger mycket hög vinmakarstandard till ett tillgängligt pris. Champagnen produceras under samma noggranna kvalitetstänk om elegans och renhet som moderhuset. Profilen är harmonisk med fräscha toner av vit frukt, citrus, brioche och fin bubblighet.",
                link: "https://www.champagne-billecart.fr"
            },
            {
                id: 10,
                fullTitle: "G.H. Martel Brut Blanc de Noirs",
                producer: "G.H. Martel & Co",
                varunr: "73036",
                iconType: "black",
                typeText: "Blanc de Noirs",
                vintage: null,
                description: "G.H. Martel grundades 1869 i Épernay och drivs i dag av familjen Rapeneau som ett av de största oberoende champagnehusen. Denna Blanc de Noirs tillverkas enbart på blå druvor (Pinot Noir och Meunier), vilket ger struktur och tyngd. Smaken bjuder på inslag av gula och röda äpplen, plommon, rostat bröd och en matvänlig finish.",
                link: "https://www.champagne-ghmartel.com"
            },
            {
                id: 11,
                fullTitle: "Billecart-Salmon Brut Réserve",
                producer: "Billecart-Salmon",
                varunr: "7454",
                iconType: "gold",
                typeText: "Brut Réserve",
                vintage: null,
                description: "Billecart-Salmon grundades 1818 i Mareuil-sur-Aÿ och är världsberömt för sin eleganta stil och långsamma jäsningsprocess vid låg temperatur. Brut Réserve är husets ikoniska flaggskepp med en perfekt balanserad blend av Pinot Noir, Meunier och Chardonnay. Vinet är extremt raffinerat med toner av gröna äpplen, färsk brioche, vita blommor och en silkeslen textur.",
                link: "https://www.champagne-billecart.fr"
            },
            {
                id: 12,
                fullTitle: "Mandois Blanc de Noirs Brut",
                producer: "Champagne Mandois",
                varunr: "50615",
                iconType: "black",
                typeText: "Blanc de Noirs",
                vintage: null,
                description: "Mandois har en historia från 1735 i Pierry och är känt för sitt starka engagemang i ekologisk och hållbar vingårdsdrift. Denna Blanc de Noirs kombinerar Pinot Noir och Pinot Meunier för att skapa en fyllig och karaktärsfull stil. Vinet har ett fint djup med smaker av mörka bär, rostat bröd och en stram, frisk syra som passar utmärkt till mat.",
                link: "https://www.champagne-mandois.fr"
            }
        ];

        let currentIndex = 0;
        let viewMode = 'single';
        let touchStartX = 0;
        let touchEndX = 0;

        function getIconHTML(item) {
            let containerBg = "";
            let iconColor = "";
            let tagStyle = "";

            if (item.iconType === 'rose') {
                containerBg = "bg-rose-100/70 border-rose-300";
                iconColor = "text-rose-600";
                tagStyle = "bg-rose-50 border-rose-200 text-rose-800";
            } else if (item.iconType === 'black') {
                containerBg = "bg-stone-900 border-stone-800 shadow-inner";
                iconColor = "text-amber-300";
                tagStyle = "bg-stone-800 border-stone-700 text-stone-200";
            } else { // Standard Gold
                containerBg = "bg-amber-50/80 border-amber-200/80";
                iconColor = "text-amber-700";
                tagStyle = "bg-amber-100/60 border-amber-200 text-amber-900";
            }

            // Vintage Star Badge
            let vintageBadge = "";
            if (item.vintage) {
                vintageBadge = `
                    <div class="absolute -top-3 -right-3 z-20">
                        <div class="relative flex items-center justify-center w-12 h-12">
                            <i class="fa-solid fa-star text-amber-500 text-4xl drop-shadow-md"></i>
                            <span class="absolute font-serif font-bold text-[10px] text-stone-950 tracking-tighter">
                                ${item.vintage}
                            </span>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="relative w-full py-4 rounded-xl ${containerBg} border flex flex-col items-center justify-center my-3 transition-all">
                    ${vintageBadge}
                    <div class="w-12 h-12 rounded-full border border-goldLeaf/30 flex items-center justify-center bg-white/50 mb-1 shadow-sm">
                        <i class="fa-solid fa-wine-glass text-xl ${iconColor}"></i>
                    </div>
                    <span class="text-[10px] font-serif uppercase tracking-widest px-3 py-0.5 rounded-full border ${tagStyle} font-semibold">
                        ${item.typeText}
                    </span>
                </div>
            `;
        }

        function renderCard() {
            const stage = document.getElementById('cardStage');
            const item = champagnes[currentIndex];

            stage.innerHTML = `
                <div id="activeCard" class="paper-card rounded-2xl p-6 sm:p-7 flex flex-col justify-between w-full h-full page-transition opacity-100 scale-100">
                    <div class="corner-ornament corner-tl"></div>
                    <div class="corner-ornament corner-tr"></div>
                    <div class="corner-ornament corner-bl"></div>
                    <div class="corner-ornament corner-br"></div>

                    <div class="inner-frame p-4 flex flex-col justify-between h-full">
                        <div>
                            <!-- Top metadata -->
                            <div class="flex items-center justify-between border-b border-goldLeaf/20 pb-2 mb-2">
                                <span class="font-serif text-[11px] uppercase tracking-widest text-stone-500">
                                    Varunr: <strong class="text-stone-900 font-semibold">${item.varunr}</strong>
                                </span>
                                <span class="handwritten text-xl text-goldLeaf">N° ${currentIndex + 1}</span>
                            </div>

                            <!-- Producer & Name -->
                            <div class="text-center my-2">
                                <p class="text-[11px] font-serif uppercase tracking-widest text-goldLeaf font-semibold">${item.producer}</p>
                                <h2 class="font-serif text-xl sm:text-2xl font-bold text-ink mt-0.5 leading-tight">
                                    ${item.fullTitle}
                                </h2>
                            </div>

                            <!-- Visual Icon -->
                            ${getIconHTML(item)}

                            <!-- Description in elegance style -->
                            <p class="text-xs sm:text-sm text-stone-700 leading-relaxed font-serif italic text-center px-1 mt-2">
                                "${item.description}"
                            </p>
                        </div>

                        <!-- Producer link -->
                        <div class="mt-4 pt-3 border-t border-goldLeaf/20 text-center">
                            <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 text-xs font-serif uppercase tracking-widest font-semibold text-stone-800 hover:text-goldLeaf transition-colors group">
                                <span>Besök ${item.producer}</span>
                                <i class="fa-solid fa-arrow-right text-[10px] group-hover:translate-x-1 transition-transform"></i>
                            </a>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('cardCounter').innerText = `${currentIndex + 1} / ${champagnes.length}`;

            // Add swipe touch handlers
            const cardEl = document.getElementById('activeCard');
            if (cardEl) {
                cardEl.addEventListener('touchstart', handleTouchStart, { passive: true });
                cardEl.addEventListener('touchend', handleTouchEnd, { passive: true });
            }
        }

        function renderListView() {
            const container = document.getElementById('listContainer');
            container.innerHTML = champagnes.map((item, idx) => `
                <div class="border-b border-goldLeaf/20 pb-6 last:border-0 last:pb-0">
                    <div class="flex items-start justify-between gap-3">
                        <div>
                            <span class="text-[10px] uppercase font-serif tracking-widest text-goldLeaf font-semibold">${item.producer}</span>
                            <h3 class="font-serif text-lg font-bold text-ink leading-snug">${item.fullTitle}</h3>
                        </div>
                        <span class="text-xs font-serif text-stone-500 bg-stone-200/60 px-2 py-1 rounded border border-stone-300 whitespace-nowrap">
                            Varunr: ${item.varunr}
                        </span>
                    </div>

                    ${getIconHTML(item)}

                    <p class="text-xs text-stone-700 font-serif italic leading-relaxed mt-2">
                        ${item.description}
                    </p>

                    <div class="mt-3 text-right">
                        <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="text-[11px] font-serif uppercase tracking-widest text-stone-700 hover:text-goldLeaf inline-flex items-center gap-1 font-semibold">
                            <span>Hemsida</span>
                            <i class="fa-solid fa-angle-right text-[10px]"></i>
                        </a>
                    </div>
                </div>
            `).join('');
        }

        function setViewMode(mode) {
            viewMode = mode;
            const singleView = document.getElementById('singleView');
            const listView = document.getElementById('listView');
            const btnSingle = document.getElementById('btnSingle');
            const btnList = document.getElementById('btnList');

            if (mode === 'single') {
                singleView.classList.remove('hidden');
                listView.classList.add('hidden');
                btnSingle.className = "px-3 py-1 rounded-full text-xs font-serif transition-all bg-goldLeaf text-stone-950 font-bold shadow";
                btnList.className = "px-3 py-1 rounded-full text-xs font-serif transition-all text-stone-400 hover:text-stone-200";
            } else {
                singleView.classList.add('hidden');
                listView.classList.remove('hidden');
                btnList.className = "px-3 py-1 rounded-full text-xs font-serif transition-all bg-goldLeaf text-stone-950 font-bold shadow";
                btnSingle.className = "px-3 py-1 rounded-full text-xs font-serif transition-all text-stone-400 hover:text-stone-200";
                renderListView();
            }
        }

        function nextCard() {
            animateTransition('left', () => {
                currentIndex = (currentIndex + 1) % champagnes.length;
                renderCard();
            });
        }

        function prevCard() {
            animateTransition('right', () => {
                currentIndex = (currentIndex - 1 + champagnes.length) % champagnes.length;
                renderCard();
            });
        }

        function animateTransition(dir, cb) {
            const card = document.getElementById('activeCard');
            if (!card) return cb();

            const offset = dir === 'left' ? '-30px' : '30px';
            card.style.transform = `translateX(${offset}) scale(0.97)`;
            card.style.opacity = '0';

            setTimeout(() => {
                cb();
            }, 180);
        }

        function handleTouchStart(e) {
            touchStartX = e.changedTouches[0].screenX;
        }

        function handleTouchEnd(e) {
            touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 40) nextCard();
            if (touchEndX - touchStartX > 40) prevCard();
        }

        document.addEventListener('keydown', (e) => {
            if (viewMode === 'single') {
                if (e.key === 'ArrowRight') nextCard();
                if (e.key === 'ArrowLeft') prevCard();
            }
        });

        window.onload = function() {
            renderCard();
        };
    </script>
</body>
</html>
